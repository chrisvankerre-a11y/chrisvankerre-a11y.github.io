<!-- global_table_public_IAFRIENDLY.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tableau des communications (Version Publique Structurée)</title>
    
    <!-- STYLES ORGANISÉS PAR FONCTIONNALITÉ -->
    <style>
        /* === VARIABLES ET THÈME === */
        :root {
            --color-bg: #0f172a;
            --color-panel: #0b1220;
            --color-text: #f8fafc;
            --color-muted: #94a3b8;
            --color-accent: #a5b4fc;
            --color-border: #1e293b;
            --color-primary: #16a34a;
            --color-danger: #dc2626;
        }

        /* === RÈGLES DE BASE === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            padding: 24px;
        }

        /* === LAYOUT PRINCIPAL === */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            max-width: 1100px;
            margin: 0 auto 16px;
        }

        .page-title {
            text-align: center;
            color: var(--color-accent);
            margin-bottom: 20px;
        }

        .actions-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* === COMPOSANTS === */
        .content-section {
            margin-bottom: 48px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.95rem;
        }

        .table-header,
        .table-cell {
            border: 1px solid var(--color-border);
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
            position: relative;
        }

        .table-header {
            background: var(--color-border);
            color: var(--color-accent);
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .table-row:nth-child(even) {
            background: #1e293b44;
        }

        /* === BOUTONS ET LIENS === */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--color-border);
            background: var(--color-panel);
            color: var(--color-text);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            font-size: inherit;
        }

        .btn-primary {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #04120b;
            font-weight: 600;
        }

        .btn-danger {
            background: var(--color-danger);
            border-color: var(--color-danger);
            color: #fff;
            font-weight: 600;
        }

        /* Renforcement des liens pour qu'ils restent cliquables */
        .text-link {
            text-decoration: underline;
            pointer-events: auto !important;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }

        .table-cell .text-link {
            position: relative;
            z-index: 2;
        }

        /* === ÉTATS ET MESSAGES === */
        .loading-indicator {
            text-align: center;
            margin-top: 40px;
            color: var(--color-muted);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- EN-TÊTE PRINCIPAL -->
    <header class="page-header">
        <h1 class="page-title">📊 Tableau des communications</h1>
        
        <!-- CONTROLES D'ACTION -->
        <div class="actions-container">
            <!-- Bouton protégé par code -->
            <a id="btnAddInfos" class="btn btn-primary" 
               href="https://chrisvankerre-a11y.github.io/dept_form_supabase.html" 
               rel="noopener noreferrer">
                ➕ Ajouter des infos
            </a>
            
            <!-- Lien direct vers l'interface privée -->
            <a class="btn btn-danger" 
               href="https://chrisvankerre-a11y.github.io/global_table_private.html" 
               rel="noopener noreferrer">
                🗑️ Supprimer des infos
            </a>
        </div>
    </header>

    <!-- INDICATEUR DE CHARGEMENT -->
    <div id="loadingIndicator" class="loading-indicator">
        Chargement des données...
    </div>

    <!-- SECTION COMMUNICATIONS DIVERSES -->
    <section id="diversSection" class="content-section hidden">
        <h2>🗒️ Communications (Divers)</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th class="table-header">Nom</th>
                    <th class="table-header">Message</th>
                    <th class="table-header">Date</th>
                </tr>
            </thead>
            <tbody id="diversBody"></tbody>
        </table>
    </section>

    <!-- SECTION NEWS -->
    <section id="newsSection" class="content-section hidden">
        <h2>🆕 News</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th class="table-header">Nom</th>
                    <th class="table-header">Titre</th>
                    <th class="table-header">Description</th>
                    <th class="table-header">Date</th>
                </tr>
            </thead>
            <tbody id="newsBody"></tbody>
        </table>
    </section>

    <!-- SECTION ÉVÉNEMENTS -->
    <section id="eventsSection" class="content-section hidden">
        <h2>📅 Événements classés par date</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th class="table-header">Date</th>
                    <th class="table-header">Nom</th>
                    <th class="table-header">Titre</th>
                    <th class="table-header">Description</th>
                </tr>
            </thead>
            <tbody id="eventsBody"></tbody>
        </table>
    </section>

    <script>
        // ====================================================================
        // CONFIGURATION ET CONSTANTES
        // ====================================================================
        const CONFIG = {
            SUPABASE_URL: 'https://isauxospdiokshswavyk.supabase.co',
            SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYXV4b3NwZGlva3Noc3dhdnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzNDY5ODYsImV4cCI6MjA3NjkyMjk4Nn0.UwVcD_DfqfjsBiZgffg_EpAXxt63qzlZC1d_j4zwsQ8',
            ACCESS_CODE: '123'
        };

        const API_ENDPOINTS = {
            ENTRIES: `${CONFIG.SUPABASE_URL}/rest/v1/entries`
        };

        // ====================================================================
        // UTILITAIRES GÉNÉRAUX
        // ====================================================================
        
        /**
         * Raccourci pour document.getElementById
         */
        function getElement(id) {
            return document.getElementById(id);
        }

        /**
         * Basculer la visibilité d'un élément
         */
        function toggleElementVisibility(elementId, isVisible) {
            const element = getElement(elementId);
            if (element) {
                element.style.display = isVisible ? 'block' : 'none';
            }
        }

        /**
         * Formater une date au format français
         */
        function formatDate(dateString) {
            try {
                return new Date(dateString || '').toLocaleString('fr-BE');
            } catch {
                return dateString || '';
            }
        }

        // ====================================================================
        // FONCTIONS DE SÉCURITÉ ET VALIDATION
        // ====================================================================
        
        /**
         * Gestionnaire de protection par code
         */
        function setupCodeProtection() {
            const addButton = getElement('btnAddInfos');
            
            addButton.addEventListener('click', function(event) {
                // Empêcher l'ouverture directe
                event.preventDefault();
                event.stopPropagation();
                
                const userCode = prompt('Entrez le code pour ajouter des infos :');
                
                if (userCode === CONFIG.ACCESS_CODE) {
                    const targetUrl = this.getAttribute('href');
                    window.open(targetUrl, '_blank', 'noopener');
                } else if (userCode !== null) {
                    alert('Code incorrect.');
                }
                // Si l'utilisateur annule (null), on ne fait rien
            });
        }

        // ====================================================================
        // FONCTIONS DE MANIPULATION DE TEXTE
        // ====================================================================
        
        /**
         * Échapper le HTML pour la sécurité
         */
        function escapeHTML(text = '') {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        /**
         * Convertir les URLs en liens cliquables
         */
        function convertUrlsToLinks(text = '') {
            // Si le texte contient déjà des balises <a>, le laisser tel quel
            if (text.includes('<a ')) return text;
            
            const escapedText = escapeHTML(text);
            const urlPattern = /(https?:\/\/[^\s)]+)|(\bwww\.[^\s)]+)/gi;
            
            return escapedText.replace(urlPattern, (match) => {
                const href = match.startsWith('http') ? match : `https://${match}`;
                return `<a class="text-link" href="${href}" target="_blank" rel="noopener noreferrer">${match}</a>`;
            });
        }

        // ====================================================================
        // FONCTIONS DE TRI
        // ====================================================================
        
        /**
         * Trier par date ascendante
         */
        function sortByDateAscending(itemA, itemB) {
            const dateA = new Date(itemA.date || itemA.created_at);
            const dateB = new Date(itemB.date || itemB.created_at);
            return dateA - dateB;
        }

        /**
         * Trier par département puis par date
         */
        function sortByDepartmentThenDate(itemA, itemB) {
            const departmentComparison = (itemA.departement || '').localeCompare(itemB.departement || '');
            
            if (departmentComparison !== 0) {
                return departmentComparison;
            }
            
            const dateA = new Date(itemA.date || itemA.created_at);
            const dateB = new Date(itemB.date || itemB.created_at);
            return dateB - dateA; // Décroissant pour avoir les plus récents en premier
        }

        // ====================================================================
        // FONCTIONS D'API SUPABASE
        // ====================================================================
        
        /**
         * Récupérer les entrées depuis Supabase
         */
        async function fetchEntriesFromSupabase() {
            const requestUrl = `${API_ENDPOINTS.ENTRIES}?select=*&order=date.nullsfirst,created_at.desc`;
            const requestHeaders = {
                apikey: CONFIG.SUPABASE_KEY,
                Authorization: `Bearer ${CONFIG.SUPABASE_KEY}`
            };
            
            try {
                const response = await fetch(requestUrl, { headers: requestHeaders });
                
                if (!response.ok) {
                    throw new Error('Erreur de connexion à Supabase');
                }
                
                return await response.json();
            } catch (error) {
                console.error('Erreur lors de la récupération des données:', error);
                throw error;
            }
        }

        // ====================================================================
        // FONCTIONS DE RENDU
        // ====================================================================
        
        /**
         * Créer une cellule de tableau
         */
        function createTableCell(content, isHTML = false) {
            const cell = document.createElement('td');
            cell.className = 'table-cell';
            
            if (isHTML) {
                cell.innerHTML = content;
            } else {
                cell.textContent = content;
            }
            
            return cell;
        }

        /**
         * Créer une ligne de tableau
         */
        function createTableRow(cells) {
            const row = document.createElement('tr');
            row.className = 'table-row';
            row.append(...cells);
            return row;
        }

        /**
         * Rendre la section Divers
         */
        function renderDiversSection(entries, containerId) {
            const container = getElement(containerId);
            container.innerHTML = '';
            
            const diversEntries = entries.filter(entry => entry.type === 'divers');
            
            diversEntries.forEach(entry => {
                const cells = [
                    createTableCell(entry.departement || ''),
                    createTableCell(convertUrlsToLinks(entry.content || ''), true),
                    createTableCell(formatDate(entry.date || entry.created_at))
                ];
                
                const row = createTableRow(cells);
                container.appendChild(row);
            });
            
            return diversEntries.length > 0;
        }

        /**
         * Rendre la section News
         */
        function renderNewsSection(entries, containerId) {
            const container = getElement(containerId);
            container.innerHTML = '';
            
            const newsEntries = entries
                .filter(entry => entry.type === 'news')
                .sort(sortByDepartmentThenDate);
            
            newsEntries.forEach(entry => {
                const cells = [
                    createTableCell(entry.departement || ''),
                    createTableCell(entry.title || ''),
                    createTableCell(convertUrlsToLinks(entry.content || ''), true),
                    createTableCell(formatDate(entry.date || entry.created_at))
                ];
                
                const row = createTableRow(cells);
                container.appendChild(row);
            });
            
            return newsEntries.length > 0;
        }

        /**
         * Rendre la section Événements
         */
        function renderEventsSection(entries, containerId) {
            const container = getElement(containerId);
            container.innerHTML = '';
            
            const eventEntries = entries
                .filter(entry => entry.type === 'event')
                .sort(sortByDateAscending);
            
            eventEntries.forEach(entry => {
                const cells = [
                    createTableCell(formatDate(entry.date || entry.created_at)),
                    createTableCell(entry.departement || ''),
                    createTableCell(entry.title || ''),
                    createTableCell(convertUrlsToLinks(entry.content || ''), true)
                ];
                
                const row = createTableRow(cells);
                container.appendChild(row);
            });
            
            return eventEntries.length > 0;
        }

        /**
         * Rendre toutes les sections
         */
        function renderAllSections(entries) {
            const hasDivers = renderDiversSection(entries, 'diversBody');
            const hasNews = renderNewsSection(entries, 'newsBody');
            const hasEvents = renderEventsSection(entries, 'eventsBody');
            
            // Afficher/masquer les sections selon le contenu
            toggleElementVisibility('diversSection', hasDivers);
            toggleElementVisibility('newsSection', hasNews);
            toggleElementVisibility('eventsSection', hasEvents);
            
            // Masquer l'indicateur de chargement
            toggleElementVisibility('loadingIndicator', false);
        }

        // ====================================================================
        // GESTION DES ÉVÉNEMENTS GLOBAUX
        // ====================================================================
        
        /**
         * Configurer le gestionnaire global des liens
         */
        function setupGlobalLinkHandler() {
            document.addEventListener('click', (event) => {
                const clickedLink = event.target.closest('a');
                if (!clickedLink) return;
                
                // Vérifier si le lien est dans une section de tableau
                const isInTableSection = clickedLink.closest('#diversSection, #newsSection, #eventsSection');
                if (!isInTableSection) return;
                
                // Empêcher le comportement par défaut et ouvrir dans un nouvel onglet
                event.preventDefault();
                event.stopPropagation();
                
                if (event.isTrusted) {
                    window.open(clickedLink.href, '_blank', 'noopener');
                }
            }, true); // Utiliser la capture pour plus de fiabilité
        }

        // ====================================================================
        // INITIALISATION DE L'APPLICATION
        // ====================================================================
        
        /**
         * Initialiser l'application
         */
        async function initializeApplication() {
            try {
                // Configuration de la sécurité
                setupCodeProtection();
                
                // Configuration des gestionnaires d'événements
                setupGlobalLinkHandler();
                
                // Chargement des données
                const entries = await fetchEntriesFromSupabase();
                renderAllSections(entries);
                
                console.log('✅ Tableau public initialisé avec succès');
            } catch (error) {
                const loadingElement = getElement('loadingIndicator');
                loadingElement.textContent = `❌ ${error.message}`;
                console.error('Erreur lors de l\'initialisation:', error);
            }
        }

        // ====================================================================
        // DÉMARRAGE DE L'APPLICATION
        // ====================================================================
        document.addEventListener('DOMContentLoaded', initializeApplication);
    </script>
</body>
</html>
