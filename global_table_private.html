<!-- global_table_private_IAFRIENDLY.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tableau Interne - Administration (Version Structurée)</title>
    
    <!-- STYLES ORGANISÉS PAR FONCTIONNALITÉ -->
    <style>
        /* === VARIABLES ET THÈME === */
        :root {
            --color-bg: #0f172a;
            --color-panel: #0b1220;
            --color-text: #f8fafc;
            --color-muted: #94a3b8;
            --color-accent: #a5b4fc;
            --color-border: #1e293b;
            --color-primary: #7c3aed;
            --color-danger: #dc2626;
            --color-error: #f87171;
        }

        /* === RÈGLES DE BASE === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            padding: 24px;
        }

        .page-title {
            text-align: center;
            color: var(--color-accent);
            margin-bottom: 20px;
        }

        /* === COMPOSANTS === */
        .content-section {
            margin-bottom: 48px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.95rem;
        }

        .table-header,
        .table-cell {
            border: 1px solid var(--color-border);
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
            position: relative;
        }

        .table-header {
            background: var(--color-border);
            color: var(--color-accent);
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .table-row:nth-child(even) {
            background: #1e293b44;
        }

        /* === AUTHENTIFICATION === */
        .auth-container {
            text-align: center;
            margin: 40px 0;
        }

        .auth-input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin: 0 8px;
        }

        .auth-error {
            color: var(--color-error);
            margin-top: 10px;
        }

        /* === BOUTONS ET ACTIONS === */
        .page-header {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }

        .btn-danger {
            background: var(--color-danger);
            color: #fff;
        }

        .actions-cell {
            text-wrap: nowrap;
        }

        /* === ÉDITION EN LIGNE === */
        .editable-cell {
            outline: 1px dashed #64748b;
        }

        /* Renforcement des liens */
        .text-link {
            text-decoration: underline;
            pointer-events: auto !important;
            position: relative;
            z-index: 3;
            cursor: pointer;
        }

        .table-cell .text-link {
            position: relative;
            z-index: 3;
        }

        /* === ÉTATS ET MESSAGES === */
        .loading-indicator {
            text-align: center;
            margin-top: 20px;
            color: var(--color-muted);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1 class="page-title">🔐 Tableau interne – Administration</h1>

    <!-- SECTION AUTHENTIFICATION -->
    <div id="authSection" class="auth-container">
        <p>Veuillez entrer le mot de passe :</p>
        <input type="password" id="passwordInput" class="auth-input" placeholder="Mot de passe" />
        <button class="btn btn-primary" onclick="handlePasswordValidation()">Valider</button>
        <div id="authError" class="auth-error"></div>
    </div>

    <!-- CONTENU PRINCIPAL (CACHÉ PAR DÉFAUT) -->
    <div id="mainContent" class="hidden">
        <!-- EN-TÊTE AVEC ACTIONS -->
        <div class="page-header">
            <h2>🧾 Entrées (entries)</h2>
            <button class="btn btn-danger" onclick="handleClearAllEntries()">
                🗑️ Tout effacer
            </button>
        </div>

        <!-- SECTION COMMUNICATIONS DIVERSES -->
        <section id="diversSection" class="content-section hidden">
            <h2>🗒️ Communications (Divers)</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="table-header">Nom</th>
                        <th class="table-header">Message</th>
                        <th class="table-header">Date</th>
                        <th class="table-header">Actions</th>
                    </tr>
                </thead>
                <tbody id="diversBody"></tbody>
            </table>
        </section>

        <!-- SECTION NEWS -->
        <section id="newsSection" class="content-section hidden">
            <h2>🆕 News</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="table-header">Nom</th>
                        <th class="table-header">Titre</th>
                        <th class="table-header">Description</th>
                        <th class="table-header">Date</th>
                        <th class="table-header">Actions</th>
                    </tr>
                </thead>
                <tbody id="newsBody"></tbody>
            </table>
        </section>

        <!-- SECTION ÉVÉNEMENTS -->
        <section id="eventsSection" class="content-section hidden">
            <h2>📅 Événements classés par date</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="table-header">Date</th>
                        <th class="table-header">Nom</th>
                        <th class="table-header">Titre</th>
                        <th class="table-header">Description</th>
                        <th class="table-header">Actions</th>
                    </tr>
                </thead>
                <tbody id="eventsBody"></tbody>
            </table>
        </section>

        <!-- INDICATEUR DE CHARGEMENT -->
        <div id="loadingIndicator" class="loading-indicator">
            Chargement des données...
        </div>
    </div>

    <script>
        // ====================================================================
        // CONFIGURATION ET CONSTANTES
        // ====================================================================
        const CONFIG = {
            PASSWORD: 'Namur2025',
            SUPABASE_URL: 'https://isauxospdiokshswavyk.supabase.co',
            SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYXV4b3NwZGlva3Noc3dhdnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzNDY5ODYsImV4cCI6MjA3NjkyMjk4Nn0.UwVcD_DfqfjsBiZgffg_EpAXxt63qzlZC1d_j4zwsQ8'
        };

        const API_ENDPOINTS = {
            ENTRIES: `${CONFIG.SUPABASE_URL}/rest/v1/entries`
        };

        const API_HEADERS = {
            apikey: CONFIG.SUPABASE_KEY,
            Authorization: `Bearer ${CONFIG.SUPABASE_KEY}`
        };

        // ====================================================================
        // UTILITAIRES GÉNÉRAUX
        // ====================================================================
        
        /**
         * Raccourci pour document.getElementById
         */
        function getElement(id) {
            return document.getElementById(id);
        }

        /**
         * Basculer la visibilité d'un élément
         */
        function toggleElementVisibility(elementId, isVisible) {
            const element = getElement(elementId);
            if (element) {
                element.style.display = isVisible ? 'block' : 'none';
            }
        }

        /**
         * Formater une date au format français
         */
        function formatDate(dateString) {
            try {
                return new Date(dateString || '').toLocaleString('fr-BE');
            } catch {
                return dateString || '';
            }
        }

        // ====================================================================
        // FONCTIONS DE SÉCURITÉ ET AUTHENTIFICATION
        // ====================================================================
        
        /**
         * Valider le mot de passe
         */
        function handlePasswordValidation() {
            const passwordInput = getElement('passwordInput');
            const errorElement = getElement('authError');
            const userPassword = passwordInput.value.trim();
            
            if (userPassword === CONFIG.PASSWORD) {
                toggleElementVisibility('authSection', false);
                toggleElementVisibility('mainContent', true);
                loadAllData();
            } else {
                errorElement.textContent = 'Mot de passe incorrect.';
            }
        }

        /**
         * Permettre la validation avec la touche Entrée
         */
        function setupEnterKeyHandler() {
            const passwordInput = getElement('passwordInput');
            passwordInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    handlePasswordValidation();
                }
            });
        }

        // ====================================================================
        // FONCTIONS DE MANIPULATION DE TEXTE
        // ====================================================================
        
        /**
         * Échapper le HTML pour la sécurité
         */
        function escapeHTML(text = '') {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        /**
         * Convertir les URLs en liens cliquables
         */
        function convertUrlsToLinks(text = '') {
            if (text.includes('<a ')) return text;
            
            const escapedText = escapeHTML(text);
            const urlPattern = /(https?:\/\/[^\s)]+)|(\bwww\.[^\s)]+)/gi;
            
            return escapedText.replace(urlPattern, (match) => {
                const href = match.startsWith('http') ? match : `https://${match}`;
                return `<a class="text-link" href="${href}" target="_blank" rel="noopener noreferrer">${match}</a>`;
            });
        }

        // ====================================================================
        // FONCTIONS DE TRI
        // ====================================================================
        
        /**
         * Trier par date ascendante
         */
        function sortByDateAscending(itemA, itemB) {
            const dateA = new Date(itemA.date || itemA.created_at);
            const dateB = new Date(itemB.date || itemB.created_at);
            return dateA - dateB;
        }

        /**
         * Trier par département puis par date
         */
        function sortByDepartmentThenDate(itemA, itemB) {
            const departmentComparison = (itemA.departement || '').localeCompare(itemB.departement || '');
            
            if (departmentComparison !== 0) {
                return departmentComparison;
            }
            
            const dateA = new Date(itemA.date || itemA.created_at);
            const dateB = new Date(itemB.date || itemB.created_at);
            return dateB - dateA;
        }

        // ====================================================================
        // FONCTIONS D'API SUPABASE
        // ====================================================================
        
        /**
         * Récupérer toutes les entrées depuis Supabase
         */
        async function fetchAllEntries() {
            const requestUrl = `${API_ENDPOINTS.ENTRIES}?select=*&order=date.nullsfirst,created_at.desc`;
            
            try {
                const response = await fetch(requestUrl, { headers: API_HEADERS });
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('Erreur lors du chargement des données:', error);
                throw error;
            }
        }

        /**
         * Mettre à jour une entrée
         */
        async function updateEntry(entryId, updates) {
            const requestUrl = `${API_ENDPOINTS.ENTRIES}?id=eq.${entryId}`;
            const requestHeaders = {
                ...API_HEADERS,
                'Content-Type': 'application/json'
            };
            
            try {
                const response = await fetch(requestUrl, {
                    method: 'PATCH',
                    headers: requestHeaders,
                    body: JSON.stringify(updates)
                });
                
                return response.ok;
            } catch (error) {
                console.error('Erreur lors de la mise à jour:', error);
                return false;
            }
        }

        /**
         * Supprimer une entrée
         */
        async function deleteEntry(entryId) {
            const requestUrl = `${API_ENDPOINTS.ENTRIES}?id=eq.${entryId}`;
            
            try {
                const response = await fetch(requestUrl, {
                    method: 'DELETE',
                    headers: API_HEADERS
                });
                
                return response.ok;
            } catch (error) {
                console.error('Erreur lors de la suppression:', error);
                return false;
            }
        }

        /**
         * Supprimer toutes les entrées
         */
        async function deleteAllEntries() {
            const requestUrl = `${API_ENDPOINTS.ENTRIES}?id=gt.0`;
            
            try {
                const response = await fetch(requestUrl, {
                    method: 'DELETE',
                    headers: API_HEADERS
                });
                
                return response.ok;
            } catch (error) {
                console.error('Erreur lors de la suppression globale:', error);
                return false;
            }
        }

        // ====================================================================
        // FONCTIONS DE RENDU AVEC ÉDITION
        // ====================================================================
        
        /**
         * Configurer l'édition pour une cellule
         */
        function setupCellEditing(cell, entryId, fieldName) {
            cell.setAttribute('contenteditable', 'true');
            cell.classList.add('editable-cell');
            cell.dataset.id = entryId;
            cell.dataset.field = fieldName;
            
            // Sauvegarder lors de la perte de focus
            cell.addEventListener('blur', () => handleCellSave(cell));
            
            // Sauvegarder avec Entrée
            cell.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    cell.blur();
                }
            });
            
            // Permettre aux liens de fonctionner même en mode édition
            cell.addEventListener('click', (event) => {
                const clickedLink = event.target.closest('a');
                if (clickedLink) {
                    event.preventDefault();
                    event.stopPropagation();
                    window.open(clickedLink.href, '_blank', 'noopener');
                }
            });
        }

        /**
         * Sauvegarder une cellule modifiée
         */
        async function handleCellSave(cell) {
            const entryId = cell.dataset.id;
            const fieldName = cell.dataset.field;
            const newValue = cell.innerText.trim();
            
            const success = await updateEntry(entryId, { [fieldName]: newValue });
            
            if (!success) {
                alert('❌ Erreur de mise à jour');
                return;
            }
            
            // Recharger si la date a changé (pour le tri)
            if (fieldName === 'date') {
                loadAllData();
            }
        }

        /**
         * Rendre la section Divers avec édition
         */
        function renderDiversSection(entries, containerId) {
            const container = getElement(containerId);
            container.innerHTML = '';
            
            const diversEntries = entries.filter(entry => entry.type === 'divers');
            
            diversEntries.forEach(entry => {
                const row = document.createElement('tr');
                row.className = 'table-row';
                
                row.innerHTML = `
                    <td class="table-cell">${escapeHTML(entry.departement || '')}</td>
                    <td class="table-cell">${convertUrlsToLinks(entry.content || '')}</td>
                    <td class="table-cell">${escapeHTML(entry.date || '')}</td>
                    <td class="table-cell actions-cell">
                        <button class="btn btn-danger" onclick="handleEntryDeletion(${entry.id})">
                            Supprimer
                        </button>
                    </td>
                `;
                
                // Configurer l'édition pour chaque cellule
                const cells = row.querySelectorAll('.table-cell');
                setupCellEditing(cells[0], entry.id, 'departement');
                setupCellEditing(cells[1], entry.id, 'content');
                setupCellEditing(cells[2], entry.id, 'date');
                
                container.appendChild(row);
            });
            
            return diversEntries.length > 0;
        }

        /**
         * Rendre la section News avec édition
         */
        function renderNewsSection(entries, containerId) {
            const container = getElement(containerId);
            container.innerHTML = '';
            
            const newsEntries = entries
                .filter(entry => entry.type === 'news')
                .sort(sortByDepartmentThenDate);
            
            newsEntries.forEach(entry => {
                const row = document.createElement('tr');
                row.className = 'table-row';
                
                row.innerHTML = `
                    <td class="table-cell">${escapeHTML(entry.departement || '')}</td>
                    <td class="table-cell">${escapeHTML(entry.title || '')}</td>
                    <td class="table-cell">${convertUrlsToLinks(entry.content || '')}</td>
                    <td class="table-cell">${escapeHTML(entry.date || '')}</td>
                    <td class="table-cell actions-cell">
                        <button class="btn btn-danger" onclick="handleEntryDeletion(${entry.id})">
                            Supprimer
                        </button>
                    </td>
                `;
                
                // Configurer l'édition pour chaque cellule
                const cells = row.querySelectorAll('.table-cell');
                setupCellEditing(cells[0], entry.id, 'departement');
                setupCellEditing(cells[1], entry.id, 'title');
                setupCellEditing(cells[2], entry.id, 'content');
                setupCellEditing(cells[3], entry.id, 'date');
                
                container.appendChild(row);
            });
            
            return newsEntries.length > 0;
        }

        /**
         * Rendre la section Événements avec édition
         */
        function renderEventsSection(entries, containerId) {
            const container = getElement(containerId);
            container.innerHTML = '';
            
            const eventEntries = entries
                .filter(entry => entry.type === 'event')
                .sort(sortByDateAscending);
            
            eventEntries.forEach(entry => {
                const row = document.createElement('tr');
                row.className = 'table-row';
                
                row.innerHTML = `
                    <td class="table-cell">${escapeHTML(entry.date || '')}</td>
                    <td class="table-cell">${escapeHTML(entry.departement || '')}</td>
                    <td class="table-cell">${escapeHTML(entry.title || '')}</td>
                    <td class="table-cell">${convertUrlsToLinks(entry.content || '')}</td>
                    <td class="table-cell actions-cell">
                        <button class="btn btn-danger" onclick="handleEntryDeletion(${entry.id})">
                            Supprimer
                        </button>
                    </td>
                `;
                
                // Configurer l'édition pour chaque cellule
                const cells = row.querySelectorAll('.table-cell');
                setupCellEditing(cells[0], entry.id, 'date');
                setupCellEditing(cells[1], entry.id, 'departement');
                setupCellEditing(cells[2], entry.id, 'title');
                setupCellEditing(cells[3], entry.id, 'content');
                
                container.appendChild(row);
            });
            
            return eventEntries.length > 0;
        }

        /**
         * Rendre toutes les sections
         */
        function renderAllSections(entries) {
            const hasDivers = renderDiversSection(entries, 'diversBody');
            const hasNews = renderNewsSection(entries, 'newsBody');
            const hasEvents = renderEventsSection(entries, 'eventsBody');
            
            toggleElementVisibility('diversSection', hasDivers);
            toggleElementVisibility('newsSection', hasNews);
            toggleElementVisibility('eventsSection', hasEvents);
            toggleElementVisibility('loadingIndicator', false);
        }

        // ====================================================================
        // GESTION DES ACTIONS
        // ====================================================================
        
        /**
         * Charger toutes les données
         */
        async function loadAllData() {
            try {
                const entries = await fetchAllEntries();
                renderAllSections(entries);
            } catch (error) {
                const loadingElement = getElement('loadingIndicator');
                loadingElement.textContent = '❌ Erreur de chargement';
            }
        }

        /**
         * Gérer la suppression d'une entrée
         */
        async function handleEntryDeletion(entryId) {
            if (!confirm(`Supprimer la ligne #${entryId} ?`)) return;
            
            const success = await deleteEntry(entryId);
            
            if (success) {
                loadAllData();
            } else {
                alert('❌ Erreur lors de la suppression');
            }
        }

        /**
         * Gérer la suppression de toutes les entrées
         */
        async function handleClearAllEntries() {
            if (!confirm('⚠️ Supprimer TOUTES les entrées ?')) return;
            
            try {
                const success = await deleteAllEntries();
                
                if (success) {
                    alert('✅ Toutes les entrées ont été supprimées.');
                    loadAllData();
                } else {
                    alert('❌ Erreur lors de la réinitialisation');
                }
            } catch (error) {
                alert('❌ Erreur réseau : ' + (error.message || 'inconnue'));
            }
        }

        // ====================================================================
        // GESTION DES ÉVÉNEMENTS GLOBAUX
        // ====================================================================
        
        /**
         * Configurer le gestionnaire global des liens
         */
        function setupGlobalLinkHandler() {
            document.addEventListener('click', (event) => {
                const clickedLink = event.target.closest('a');
                if (!clickedLink) return;
                
                const isInTableSection = clickedLink.closest('#diversSection, #newsSection, #eventsSection');
                if (!isInTableSection) return;
                
                event.preventDefault();
                event.stopPropagation();
                
                if (event.isTrusted) {
                    window.open(clickedLink.href, '_blank', 'noopener');
                }
            }, true);
        }

        // ====================================================================
        // INITIALISATION DE L'APPLICATION
        // ====================================================================
        
        /**
         * Initialiser l'application
         */
        function initializeApplication() {
            setupEnterKeyHandler();
            setupGlobalLinkHandler();
            console.log('✅ Tableau privé initialisé (en attente d\'authentification)');
        }

        // ====================================================================
        // DÉMARRAGE DE L'APPLICATION
        // ====================================================================
        document.addEventListener('DOMContentLoaded', initializeApplication);
    </script>
</body>
</html>
